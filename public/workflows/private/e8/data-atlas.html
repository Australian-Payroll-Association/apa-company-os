<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Edge8 Data Atlas | Edge8</title>
<style>
  :root {
    --dark: #101014; --panel: #16161c; --card: #1A1A1F; --card-hi: #22222a;
    --border: rgba(234,238,242,0.10); --border-hi: rgba(234,238,242,0.25);
    --text: #EAEEF2; --muted: #8b909a; --dim: #5c616b;
    --blue: #3B8CF5; --mint: #6FF2C1;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--dark); color: var(--text); }

  /* ---- top bar ---- */
  #topbar { position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: rgba(16,16,20,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  #topbar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
  #topbar h1 span { color: var(--mint); }
  #stats { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #topbar .spacer { flex: 1; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .btn { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; height: 30px; min-width: 30px; padding: 0 10px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  #zpct { font-size: 12px; color: var(--muted); min-width: 42px; text-align: center; }
  #menu-toggle { display: none; }

  /* ---- sidebar index ---- */
  #sidebar { position: fixed; top: 52px; bottom: 0; left: 0; width: 272px; z-index: 30; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #searchwrap { padding: 10px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; height: 34px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0 10px; font-size: 13px; outline: none; }
  #search:focus { border-color: var(--blue); }
  #index { flex: 1; overflow-y: auto; padding: 6px 0 30px; }
  .dom-group summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); user-select: none; }
  .dom-group summary::-webkit-details-marker { display: none; }
  .dom-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dom-count { margin-left: auto; font-weight: 400; color: var(--dim); }
  .idx-item { display: flex; align-items: baseline; gap: 6px; padding: 4px 12px 4px 30px; font-size: 13px; cursor: pointer; color: var(--text); }
  .idx-item:hover { background: var(--card-hi); }
  .idx-item.active { background: rgba(59,140,245,0.18); }
  .idx-item .rc { margin-left: auto; font-size: 11px; color: var(--dim); }
  .idx-sub { padding: 1px 12px 3px 44px; font-size: 12px; color: var(--muted); cursor: pointer; font-family: var(--mono); }
  .idx-sub:hover { color: var(--mint); }
  .off-group summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text); user-select: none; }
  .off-group summary::-webkit-details-marker { display: none; }
  .off-group + .off-group { border-top: 1px solid var(--border); }
  .off-group[open] > summary { color: var(--mint); }
  .sub-group { margin: 0 0 8px; }
  .sub-head { display: flex; align-items: center; gap: 6px; padding: 5px 12px 3px 22px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .no-results { padding: 16px; font-size: 13px; color: var(--muted); }

  /* ---- canvas ---- */
  #viewport { position: absolute; top: 52px; left: 272px; right: 0; bottom: 0; overflow: hidden; cursor: grab; background:
    radial-gradient(circle at 30% 20%, rgba(59,140,245,0.05), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(111,242,193,0.04), transparent 50%), var(--dark); }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: rgba(139,144,154,0.35); stroke-width: 1.5; }
  body.has-sel #edges path { stroke: rgba(139,144,154,0.10); }
  #edges path.out { stroke: var(--blue); stroke-width: 2.5; }
  #edges path.in { stroke: var(--mint); stroke-width: 2.5; }

  .office-box { position: absolute; border: 1.5px solid; border-radius: 28px; }
  .office-title { position: absolute; top: 20px; left: 32px; font-size: 32px; font-weight: 800; letter-spacing: 0.01em; opacity: 0.95; pointer-events: none; }
  .dom-box { position: absolute; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,0.022); }
  .dom-title { position: absolute; top: 12px; left: 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.82; pointer-events: none; }

  .tcard { position: absolute; width: 250px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .tcard:hover { border-color: var(--border-hi); }
  .tcard.sel { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(59,140,245,0.45), 0 10px 34px rgba(0,0,0,0.5); z-index: 5; }
  .tcard.rel { border-color: rgba(111,242,193,0.5); z-index: 4; }
  body.has-sel .tcard:not(.sel):not(.rel), body.searching .tcard.faded { opacity: 0.28; }
  .tc-head { height: 42px; padding: 0 10px; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--border); border-top: 3px solid; background: var(--card-hi); }
  .tc-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-rows { font-size: 10px; color: var(--dim); }
  .tc-col { height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 11px; font-family: var(--mono); }
  .tc-col:nth-child(even) { background: rgba(255,255,255,0.018); }
  .tc-col .cn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-col .ct { margin-left: auto; color: var(--dim); flex: none; font-size: 10px; }
  .tc-col.pk .cn { color: var(--mint); font-weight: 700; }
  .tc-col.fk .cn { color: var(--blue); }

  /* ---- detail panel ---- */
  #detail { position: fixed; top: 52px; right: 0; bottom: 0; width: 340px; z-index: 35; background: var(--panel); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.22s ease; display: flex; flex-direction: column; }
  #detail.open { transform: none; }
  #d-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  #d-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  #d-domain { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  #d-name { font-size: 18px; font-weight: 800; font-family: var(--mono); word-break: break-all; }
  #d-rows { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #d-comment { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  #d-body { flex: 1; overflow-y: auto; padding: 10px 0 40px; }
  .d-sec { padding: 10px 16px 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
  .d-col { padding: 5px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; font-size: 12px; font-family: var(--mono); border-bottom: 1px solid rgba(234,238,242,0.04); }
  .d-col .cn { font-weight: 600; }
  .d-col.pk .cn { color: var(--mint); }
  .d-col .ct { color: var(--dim); font-size: 11px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: 0.03em; }
  .b-pk { background: rgba(111,242,193,0.15); color: var(--mint); }
  .b-nn { background: rgba(139,144,154,0.15); color: var(--muted); }
  .d-fk { width: 100%; font-size: 11px; color: var(--blue); cursor: pointer; }
  .d-fk:hover { text-decoration: underline; }
  .d-fk.ext { color: var(--muted); cursor: default; }
  .d-fk.ext:hover { text-decoration: none; }
  .d-ccomment { width: 100%; font-size: 11px; color: var(--dim); font-family: var(--font); line-height: 1.4; }
  .d-ref { padding: 5px 16px; font-size: 12px; font-family: var(--mono); color: var(--mint); cursor: pointer; }
  .d-ref:hover { background: var(--card-hi); }
  .d-ref span { color: var(--dim); }

  /* ---- minimap ---- */
  #minimap { position: fixed; right: 14px; bottom: 14px; z-index: 34; border: 1px solid var(--border); border-radius: 10px; background: rgba(16,16,20,0.9); cursor: pointer; transition: right 0.22s ease; }
  body.detail-open #minimap { right: 354px; }

  /* ---- hint ---- */
  #hint { position: fixed; left: 286px; bottom: 14px; z-index: 20; font-size: 11px; color: var(--dim); background: rgba(16,16,20,0.8); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }

  @media (max-width: 860px) {
    #menu-toggle { display: block; }
    #sidebar { transform: translateX(-100%); transition: transform 0.2s ease; }
    body.menu-open #sidebar { transform: none; }
    #viewport { left: 0; }
    #detail { width: min(340px, 92vw); }
    #hint { display: none; }
    #stats { display: none; }
  }
</style>
</head>

    let x = 0, y = 0, rowH = 0, innerW = 0;
    const placements = [];
    for (const s of off.subs) {
      if (x > 0 && x + s.w > OFF_TARGET_W) { x = 0; y += rowH + SUB_GAP; rowH = 0; }
      placements.push({ s, lx: x, ly: y });
      x += s.w + SUB_GAP; rowH = Math.max(rowH, s.h); innerW = Math.max(innerW, x - SUB_GAP);
    }
    return { off, placements, w: innerW + OFF_PAD * 2, h: OFF_TITLE_H + y + rowH + OFF_PAD };
  });

  // 4. arrange office boxes into rows by area
  const totalArea = laid.reduce((a, o) => a + (o.w + OFF_GAP) * (o.h + OFF_GAP), 0);

  let ox = 0, oy = 0, orowH = 0;
  for (const o of laid) {
    if (ox > 0 && ox + o.w > targetW) { ox = 0; oy += orowH + OFF_GAP; orowH = 0; }
    officeBoxes.push({ x: ox, y: oy, w: o.w, h: o.h, name: o.off.name, color: o.off.color });

      }
    }
    ox += o.w + OFF_GAP; orowH = Math.max(orowH, o.h);
  }
})();
const WORLD = officeBoxes.reduce((b, d) => ({ w: Math.max(b.w, d.x + d.w), h: Math.max(b.h, d.y + d.h) }), { w: 0, h: 0 });

// ---------------- render world ----------------

// ---------------- pan / zoom ----------------
const vp = document.getElementById('viewport');
const view = { x: 0, y: 0, k: 1 };
const KMIN = 0.04, KMAX = 2.5;

// ---------------- selection + detail ----------------
let selected = null;
const refsTo = {};
for (const [src, sc, tgt, tc] of DATA.fks) (refsTo[tgt] = refsTo[tgt] || []).push([src, sc, tc]);

function renderDetail(t) {

// ---------------- sidebar index + search ----------------
const idx = document.getElementById('index');
function buildIndex(q) {

  DATA.meta.nTables + ' tables · ' + DATA.meta.nCols.toLocaleString('en-US') + ' columns · ' + DATA.meta.nFks + ' relationships · snapshot ' + DATA.meta.generated;

her than editing raw rows); join clients by name (use `client_identities`)."},{"t":"htt.token_entries","k":"htt.token_entries","uk":"htt.token_entries","g":"one minted human-token record attributed to a person, repo, and client for a span of work.","b":"transactional · Effort & value measurement","ti":"1 spine","s":"active","o":"written by the mint engine from `pull_requests`; humans never insert directly. Span tiling is the settled minting spec; tenths are the final granularity.","u":"the evidence behind renewal and referral conversations; wallet and burn reporting (UI vocabulary: burnt / allotted / unburnt only — never hours).","re":"read-only for consumers; derived value metrics are views on top, not sibling tables.","dn":"over-count under any tuning (under-count anomalies are acceptable, over-count never); introduce hours as a UI unit downstream."},{"t":"company_os.people_sensitive","k":"people_sensitive","uk":"people_sensitive","g":"one person's sensitive personal attributes, split from `people` so broad reads can never see them.","b":"master · People & org structure","ti":"3 support","s":"active","o":"HR flows gated by canViewSensitive.","u":"super-admin people views only. RLS on, no policies, service-role only.","re":"any new sensitive person attribute goes here, not on `people`.","dn":""},{"t":"company_os.candidate_sensitive","k":"candidate_sensitive","uk":"candidate_sensitive","g":"one candidate's sensitive attributes (salary expectation, recruiter-verified and AI-extracted), split from `candidate_profile` so broad ATS reads can never see them.","b":"master · Candidates","ti":"3 support","s":"active","o":"recruiter flows gated by canViewSensitive; hardened 26 Aug 2026 and explicitly revoked from `chatbot_reader`.","u":"super-admin candidate views only. Zero rows today is deliberate: relocated for future writes.","re":"any new sensitive candidate attribute goes here, mirroring the `people_sensitive` convention.","dn":"put salary or PII on `candidate_profile` or `applications`; those are read broadly, including by the interview-panelist AI prompt."},{"t":"company_os.compensation_sensitive","k":"compensation","uk":"compensation_sensitive","g":"one compensation arrangement for a team member, effective-dated with approver — real pay data.","b":"master · People & org structure","ti":"3 support","s":"active","o":"HR comp-change flows with `approved_by` and `change_reason`; renamed from `compensation` 28 Aug 2026 to match the `_sensitive` convention.","u":"admin comp views and contractor payment calculation, gated by canViewSensitive; blocked by name in the NL-to-SQL assistant block-lists.","re":"comp history extends here (`effective_from`/`effective_to`, `is_current`); never store pay on `team_members` or `people`.","dn":""},{"t":"company_os.events","k":"events","uk":"events","g":"one event we run or speak at — workshop, retreat, talk night — with capacity, dates, and status.","b":"master · Products & offerings","ti":"2 stage engine","s":"active","o":"events admin flows.","u":"5 tables reference it (registrations, agenda, P&L, talks, products); 4,054 reads — the events surface and public pages.","re":"new event-scoped features FK to `events.id`; ticketing links via `products.event_id`.","dn":""},{"t":"company_os.event_registrations","k":"event_registrations","uk":"event_registrations","g":"one person's registration for one event, from signup through attendance.","b":"transactional · Revenue documents","ti":"2 stage engine","s":"active","o":"public registration flows and admin entry.","u":"10,349 reads — event pages, capacity checks, follow-up.","re":"attendance-scoped facts extend here; the registrant is a `people` row.","dn":""},{"t":"company_os.marketing_content","k":"marketing_calendar","uk":"marketing_content","g":"one planned or published piece of marketing content (blog, email, social, broadcast) with channel, status, and authored body.","b":"transactional · Marketing & content execution","ti":"2 stage engine","s":"act
