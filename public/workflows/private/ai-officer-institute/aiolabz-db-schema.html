<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AIO Labz: V2 Database Schema | Edge8</title>
<style>
  :root {
    --dark: #101014; --panel: #16161c; --card: #1A1A1F; --card-hi: #22222a;
    --border: rgba(234,238,242,0.10); --border-hi: rgba(234,238,242,0.25);
    --text: #EAEEF2; --muted: #8b909a; --dim: #5c616b;
    --blue: #3B8CF5; --mint: #6FF2C1;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--dark); color: var(--text); }

  /* ---- top bar ---- */
  #topbar { position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: rgba(16,16,20,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  #topbar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
  #topbar h1 span { color: var(--mint); }
  #stats { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #topbar .spacer { flex: 1; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .btn { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; height: 30px; min-width: 30px; padding: 0 10px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  #zpct { font-size: 12px; color: var(--muted); min-width: 42px; text-align: center; }
  #menu-toggle { display: none; }

  /* ---- sidebar index ---- */
  #sidebar { position: fixed; top: 52px; bottom: 0; left: 0; width: 272px; z-index: 30; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #searchwrap { padding: 10px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; height: 34px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0 10px; font-size: 13px; outline: none; }
  #search:focus { border-color: var(--blue); }
  #index { flex: 1; overflow-y: auto; padding: 6px 0 30px; }
  .dom-group summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); user-select: none; }
  .dom-group summary::-webkit-details-marker { display: none; }
  .dom-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dom-count { margin-left: auto; font-weight: 400; color: var(--dim); }
  .idx-item { display: flex; align-items: baseline; gap: 6px; padding: 4px 12px 4px 30px; font-size: 13px; cursor: pointer; color: var(--text); }
  .idx-item:hover { background: var(--card-hi); }
  .idx-item.active { background: rgba(59,140,245,0.18); }
  .idx-item .rc { margin-left: auto; font-size: 11px; color: var(--dim); }
  .idx-sub { padding: 1px 12px 3px 44px; font-size: 12px; color: var(--muted); cursor: pointer; font-family: var(--mono); }
  .idx-sub:hover { color: var(--mint); }
  .no-results { padding: 16px; font-size: 13px; color: var(--muted); }

  /* ---- canvas ---- */
  #viewport { position: absolute; top: 52px; left: 272px; right: 0; bottom: 0; overflow: hidden; cursor: grab; background:
    radial-gradient(circle at 30% 20%, rgba(59,140,245,0.05), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(111,242,193,0.04), transparent 50%), var(--dark); }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: rgba(139,144,154,0.35); stroke-width: 1.5; }
  body.has-sel #edges path { stroke: rgba(139,144,154,0.10); }
  #edges path.out { stroke: var(--blue); stroke-width: 2.5; }
  #edges path.in { stroke: var(--mint); stroke-width: 2.5; }

  .dom-box { position: absolute; border: 1px solid var(--border); border-radius: 18px; background: rgba(255,255,255,0.015); }
  .dom-title { position: absolute; top: 14px; left: 24px; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; opacity: 0.9; pointer-events: none; }

  .tcard { position: absolute; width: 250px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .tcard:hover { border-color: var(--border-hi); }
  .tcard.sel { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(59,140,245,0.45), 0 10px 34px rgba(0,0,0,0.5); z-index: 5; }
  .tcard.rel { border-color: rgba(111,242,193,0.5); z-index: 4; }
  body.has-sel .tcard:not(.sel):not(.rel), body.searching .tcard.faded { opacity: 0.28; }
  .tc-head { height: 42px; padding: 0 10px; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--border); border-top: 3px solid; background: var(--card-hi); }
  .tc-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-rows { font-size: 10px; color: var(--dim); }
  .tc-col { height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 11px; font-family: var(--mono); }
  .tc-col:nth-child(even) { background: rgba(255,255,255,0.018); }
  .tc-col .cn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-col .ct { margin-left: auto; color: var(--dim); flex: none; font-size: 10px; }
  .tc-col.pk .cn { color: var(--mint); font-weight: 700; }
  .tc-col.fk .cn { color: var(--blue); }

  /* ---- detail panel ---- */
  #detail { position: fixed; top: 52px; right: 0; bottom: 0; width: 340px; z-index: 35; background: var(--panel); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.22s ease; display: flex; flex-direction: column; }
  #detail.open { transform: none; }
  #d-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  #d-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  #d-domain { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  #d-name { font-size: 18px; font-weight: 800; font-family: var(--mono); word-break: break-all; }
  #d-rows { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #d-comment { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  #d-body { flex: 1; overflow-y: auto; padding: 10px 0 40px; }
  .d-sec { padding: 10px 16px 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
  .d-col { padding: 5px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; font-size: 12px; font-family: var(--mono); border-bottom: 1px solid rgba(234,238,242,0.04); }
  .d-col .cn { font-weight: 600; }
  .d-col.pk .cn { color: var(--mint); }
  .d-col .ct { color: var(--dim); font-size: 11px; }
  .badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: 0.03em; }
  .b-pk { background: rgba(111,242,193,0.15); color: var(--mint); }
  .b-nn { background: rgba(139,144,154,0.15); color: var(--muted); }
  .d-fk { width: 100%; font-size: 11px; color: var(--blue); cursor: pointer; }
  .d-fk:hover { text-decoration: underline; }
  .d-fk.ext { color: var(--muted); cursor: default; }
  .d-fk.ext:hover { text-decoration: none; }
  .d-ccomment { width: 100%; font-size: 11px; color: var(--dim); font-family: var(--font); line-height: 1.4; }
  .d-ref { padding: 5px 16px; font-size: 12px; font-family: var(--mono); color: var(--mint); cursor: pointer; }
  .d-ref:hover { background: var(--card-hi); }
  .d-ref span { color: var(--dim); }

  /* ---- minimap ---- */
  #minimap { position: fixed; right: 14px; bottom: 14px; z-index: 34; border: 1px solid var(--border); border-radius: 10px; background: rgba(16,16,20,0.9); cursor: pointer; transition: right 0.22s ease; }
  body.detail-open #minimap { right: 354px; }

  /* ---- hint ---- */
  #hint { position: fixed; left: 286px; bottom: 14px; z-index: 20; font-size: 11px; color: var(--dim); background: rgba(16,16,20,0.8); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }

  @media (max-width: 860px) {
    #menu-toggle { display: block; }
    #sidebar { transform: translateX(-100%); transition: transform 0.2s ease; }
    body.menu-open #sidebar { transform: none; }
    #viewport { left: 0; }
    #detail { width: min(340px, 92vw); }
    #hint { display: none; }
    #stats { display: none; }
  }
</style>
</head>

// ---------------- layout ----------------
const CARD_W = 250, ROW_H = 20, HDR_H = 42, GAP = 26, PAD = 30, TITLE_H = 52, DGAP = 90;
const pos = {};            // table -> {x, y, w, h, dom}
const domBoxes = [];       // {x, y, w, h, name, color}
const domOf = {};
DATA.domains.forEach((d, di) => d.tables.forEach(t => domOf[t] = di));

(function layout() {
  const sized = DATA.domains.map(d => {
    const cards = d.tables.map(t => ({ t, h: HDR_H + DATA.tables[t].cols.length * ROW_H }));
    const ncols = Math.max(1, Math.min(6, Math.ceil(Math.sqrt(cards.length * 1.6))));
    const colH = new Array(ncols).fill(0);
    const placed = cards.map(c => {
      let ci = 0;
      for (let i = 1; i < ncols; i++) if (colH[i] < colH[ci]) ci = i;
      const p = { ...c, cx: ci, cy: colH[ci] };
      colH[ci] += c.h + GAP;
      return p;
    });
    const w = ncols * CARD_W + (ncols - 1) * GAP + PAD * 2;
    const h = TITLE_H + Math.max(...colH) - GAP + PAD;
    return { d, placed, w, h };
  });

  const totalArea = sized.reduce((s, x) => s + (x.w + DGAP) * (x.h + DGAP), 0);
  const targetW = Math.max(2400, Math.sqrt(totalArea) * 1.5);
  let x = 0, y = 0, rowH = 0;
  for (const s of sized) {
    if (x > 0 && x + s.w > targetW) { x = 0; y += rowH + DGAP; rowH = 0; }
    domBoxes.push({ x, y, w: s.w, h: s.h, name: s.d.n, color: s.d.color });
    for (const p of s.placed) {
      pos[p.t] = { x: x + PAD + p.cx * (CARD_W + GAP), y: y + TITLE_H + p.cy, w: CARD_W, h: p.h, dom: DATA.domains.indexOf(s.d) };
    }
    x += s.w + DGAP; rowH = Math.max(rowH, s.h);
  }
})();
const WORLD = domBoxes.reduce((b, d) => ({ w: Math.max(b.w, d.x + d.w), h: Math.max(b.h, d.y + d.h) }), { w: 0, h: 0 });

// ---------------- render world ----------------
const world = document.getElementById('world');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fmtRows = n => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);

let html = '';
for (const d of domBoxes) {
  html += '<div class="dom-box" style="left:' + d.x + 'px;top:' + d.y + 'px;width:' + d.w + 'px;height:' + d.h + 'px">'
        + '<div class="dom-title" style="color:' + d.color + '">' + esc(d.name) + '</div></div>';
}
for (const [t, p] of Object.entries(pos)) {
  const info = DATA.tables[t], color = DATA.domains[p.dom].color;
  let rows = '';
  for (const c of info.cols) {
    const cls = (c[2] & 1 ? ' pk' : '') + (c[2] & 2 ? ' fk' : '');
    rows += '<div class="tc-col' + cls + '"><span class="cn" title="' + esc(c[0]) + '">' + esc(c[0]) + '</span><span class="ct">' + esc(c[1]) + '</span></div>';
  }
  html += '<div class="tcard" data-t="' + esc(t) + '" style="left:' + p.x + 'px;top:' + p.y + 'px">'
        + '<div class="tc-head" style="border-top-color:' + color + '"><div class="tc-name">' + esc(t) + '</div>'
        + '<div class="tc-rows">' + fmtRows(info.r) + ' rows · ' + info.cols.length + ' cols</div></div>' + rows + '</div>';
}
world.insertAdjacentHTML('beforeend', html);

// edges
const svg = document.getElementById('edges');
svg.setAttribute('width', WORLD.w); svg.setAttribute('height', WORLD.h);
const colIdx = (t, c) => DATA.tables[t].cols.findIndex(x => x[0] === c);
let paths = '';
for (const [src, sc, tgt] of DATA.fks) {
  const sp = pos[src], tp = pos[tgt];
  if (!sp || !tp) continue;
  const sy = sp.y + HDR_H + colIdx(src, sc) * ROW_H + ROW_H / 2;
  const ty = tp.y + HDR_H / 2;
  let dPath;
  if (src === tgt) {
    const x = sp.x + sp.w;
    dPath = 'M ' + x + ' ' + sy + ' C ' + (x + 60) + ' ' + sy + ' ' + (x + 60) + ' ' + ty + ' ' + x + ' ' + ty;
  } else {
    const sRight = tp.x + tp.w / 2 > sp.x + sp.w / 2;
    const sx = sRight ? sp.x + sp.w : sp.x;
    const tx = sRight ? tp.x : tp.x + tp.w;
    const dx = Math.min(180, Math.max(50, Math.abs(tx - sx) / 2)) * (sRight ? 1 : -1);
    dPath = 'M ' + sx + ' ' + sy + ' C ' + (sx + dx) + ' ' + sy + ' ' + (tx - dx) + ' ' + ty + ' ' + tx + ' ' + ty;
  }
  paths += '<path d="' + dPath + '" data-s="' + esc(src) + '" data-g="' + esc(tgt) + '"/>';
}
svg.innerHTML = paths;

// ---------------- pan / zoom ----------------
const vp = document.getElementById('viewport');
const view = { x: 0, y: 0, k: 1 };
const KMIN = 0.04, KMAX = 2.5;
function apply() {
  world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  document.getElementById('zpct').textContent = Math.round(view.k * 100) + '%';
  drawMinimap();
}
function fitAll() {
  const r = vp.getBoundingClientRect();
  view.k = Math.max(KMIN, Math.min(r.width / (WORLD.w + 120), r.height / (WORLD.h + 120)));
  view.x = (r.width - WORLD.w * view.k) / 2;
  view.y = (r.height - WORLD.h * view.k) / 2;
  apply();
}
function zoomAt(cx, cy, factor) {
  const k2 = Math.max(KMIN, Math.min(KMAX, view.k * factor));
  view.x = cx - (cx - view.x) * (k2 / view.k);
  view.y = cy - (cy - view.y) * (k2 / view.k);
  view.k = k2;
  apply();
}
let interacted = false;
vp.addEventListener('wheel', e => {
  e.preventDefault();
  interacted = true;
  const r = vp.getBoundingClientRect();
  if (e.ctrlKey || !e.deltaX) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.002));
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive: false });

let drag = null;
vp.addEventListener('pointerdown', e => {
  interacted = true;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 5) { drag.moved = true; vp.classList.add('panning'); }
  if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
vp.addEventListener('pointerup', e => {
  vp.classList.remove('panning');
  const wasClick = drag && !drag.moved;
  drag = null;
  if (!wasClick) return;
  const card = e.target.closest('.tcard');
  if (card) select(card.dataset.t); else deselect();
});

let anim = null;
function flyTo(t) {
  const p = pos[t], r = vp.getBoundingClientRect();
  const k2 = Math.max(0.85, Math.min(1.1, view.k < 0.5 ? 0.9 : view.k));
  const tx = r.width / 2 - (p.x + p.w / 2) * k2;
  const ty = r.height / 2 - (p.y + Math.min(p.h, r.height / k2 * 0.8) / 2) * k2;
  const from = { ...view }, t0 = performance.now();
  cancelAnimationFrame(anim);
  (function step(now) {
    const u = Math.min(1, (now - t0) / 420), e2 = 1 - Math.pow(1 - u, 3);
    view.x = from.x + (tx - from.x) * e2;
    view.y = from.y + (ty - from.y) * e2;
    view.k = from.k + (k2 - from.k) * e2;
    apply();
    if (u < 1) anim = requestAnimationFrame(step);
  })(t0);
}

// ---------------- selection + detail ----------------
let selected = null;
const refsTo = {};
for (const [src, sc, tgt, tc] of DATA.fks) (refsTo[tgt] = refsTo[tgt] || []).push([src, sc, tc]);

function select(t, fly = true) {
  interacted = true;
  selected = t;
  document.body.classList.add('has-sel', 'detail-open');
  document.querySelectorAll('.tcard').forEach(c => {
    c.classList.toggle('sel', c.dataset.t === t);
    c.classList.remove('rel');
  });
  svg.querySelectorAll('path').forEach(p => {
    p.classList.toggle('out', p.dataset.s === t);
    p.classList.toggle('in', p.dataset.g === t && p.dataset.s !== t);
  });
  const related = new Set();
  for (const [src, , tgt] of DATA.fks) {
    if (src === t) related.add(tgt);
    if (tgt === t) related.add(src);
  }
  related.delete(t);
  related.forEach(rt => { const c = document.querySelector('.tcard[data-t="' + rt + '"]'); if (c) c.classList.add('rel'); });
  document.querySelectorAll('.idx-item').forEach(i => i.classList.toggle('active', i.dataset.t === t));
  renderDetail(t);
  document.getElementById('detail').classList.add('open');
  if (fly) flyTo(t);
  history.replaceState(null, '', '#' + t);
}
function deselect() {
  selected = null;
  document.body.classList.remove('has-sel', 'detail-open');
  document.querySelectorAll('.tcard.sel, .tcard.rel').forEach(c => c.classList.remove('sel', 'rel'));
  svg.querySelectorAll('path.out, path.in').forEach(p => p.classList.remove('out', 'in'));
  document.querySelectorAll('.idx-item.active').forEach(i => i.classList.remove('active'));
  document.getElementById('detail').classList.remove('open');
  history.replaceState(null, '', location.pathname);
}
document.getElementById('d-close').onclick = deselect;

function renderDetail(t) {
  const info = DATA.tables[t], di = domOf[t], d = DATA.domains[di];
  document.getElementById('d-domain').innerHTML = '<span class="dom-dot" style="background:' + d.color + '"></span>' + esc(d.n);
  document.getElementById('d-name').textContent = t;
  document.getElementById('d-rows').textContent = info.r.toLocaleString('en-US') + ' rows · ' + info.cols.length + ' columns';
  document.getElementById('d-comment').textContent = info.c || '';
  let b = '<div class="d-sec">Columns</div>';
  for (const c of info.cols) {
    const badges = (c[2] & 1 ? '<span class="badge b-pk">PK</span>' : '') + (c[2] & 4 && !(c[2] & 1) ? '<span class="badge b-nn">NN</span>' : '');
    let fk = '';
    if (c[3]) {
      const [ft] = String(c[3]).split('.');
      const ext = !DATA.tables[ft];
      fk = '<div class="d-fk' + (ext ? ' ext' : '') + '" ' + (ext ? '' : 'data-goto="' + esc(ft) + '"') + '>→ ' + esc(c[3]) + '</div>';
    }
    const cc = c[4] ? '<div class="d-ccomment">' + esc(c[4]) + '</div>' : '';
    b += '<div class="d-col' + (c[2] & 1 ? ' pk' : '') + '"><span class="cn">' + esc(c[0]) + '</span><span class="ct">' + esc(c[1]) + '</span>' + badges + fk + cc + '</div>';
  }
  const refs = refsTo[t] || [];
  if (refs.length) {
    b += '<div class="d-sec">Referenced by (' + refs.length + ')</div>';
    for (const [src, sc] of refs) b += '<div class="d-ref" data-goto="' + esc(src) + '">' + esc(src) + '<span>.' + esc(sc) + '</span></div>';
  }
  const body = document.getElementById('d-body');
  body.innerHTML = b;
  body.scrollTop = 0;
  body.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => select(el.dataset.goto));
}

// ---------------- sidebar index + search ----------------
const idx = document.getElementById('index');
function buildIndex(q) {
  q = (q || '').trim().toLowerCase();
  document.body.classList.toggle('searching', !!q);
  let out = '', any = false;
  for (const d of DATA.domains) {
    let items = '';
    for (const t of d.tables) {
      const info = DATA.tables[t];
      const nameHit = !q || t.toLowerCase().includes(q);
      const colHits = q ? info.cols.filter(c => c[0].toLowerCase().includes(q)).slice(0, 6) : [];
      const card = document.querySelector('.tcard[data-t="' + t + '"]');
      if (card) card.classList.toggle('faded', !!q && !nameHit && !colHits.length);
      if (!nameHit && !colHits.length) continue;
      any = true;
      items += '<div class="idx-item" data-t="' + esc(t) + '"><span>' + esc(t) + '</span><span class="rc">' + fmtRows(info.r) + '</span></div>';
      for (const c of colHits) items += '<div class="idx-sub" data-t="' + esc(t) + '">· ' + esc(c[0]) + '</div>';
    }
    if (items) out += '<details class="dom-group" open><summary><span class="dom-dot" style="background:' + d.color + '"></span>' + esc(d.n) + '<span class="dom-count">' + d.tables.length + '</span></summary>' + items + '</details>';
  }
  idx.innerHTML = any ? out : '<div class="no-results">No tables or columns match.</div>';
  idx.querySelectorAll('[data-t]').forEach(el => el.onclick = () => {
    select(el.dataset.t);
    if (window.innerWidth <= 860) document.body.classList.remove('menu-open');
  });
  if (selected) document.querySelectorAll('.idx-item').forEach(i => i.classList.toggle('active', i.dataset.t === selected));
}
const search = document.getElementById('search');
search.addEventListener('input', () => buildIndex(search.value));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  if (e.key === 'Escape') { if (document.activeElement === search) { search.value = ''; buildIndex(''); search.blur(); } else deselect(); }
});

// ---------------- minimap ----------------
const mm = document.getElementById('minimap');
const MMW = 210, mmScale = MMW / WORLD.w, MMH = Math.max(60, Math.round(WORLD.h * mmScale));
mm.width = MMW * devicePixelRatio; mm.height = MMH * devicePixelRatio;
mm.style.width = MMW + 'px'; mm.style.height = MMH + 'px';
const mctx = mm.getContext('2d');
function drawMinimap() {
  mctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  mctx.clearRect(0, 0, MMW, MMH);
  for (const d of domBoxes) {
    mctx.fillStyle = d.color + '22';
    mctx.strokeStyle = d.color + '66';
    mctx.fillRect(d.x * mmScale, d.y * mmScale, d.w * mmScale, d.h * mmScale);
    mctx.strokeRect(d.x * mmScale, d.y * mmScale, d.w * mmScale, d.h * mmScale);
  }
  const r = vp.getBoundingClientRect();
  mctx.strokeStyle = '#EAEEF2';
  mctx.lineWidth = 1.5;
  mctx.strokeRect(-view.x / view.k * mmScale, -view.y / view.k * mmScale, r.width / view.k * mmScale, r.height / view.k * mmScale);
}
function mmJump(e) {
  const r = mm.getBoundingClientRect();
  const wx = (e.clientX - r.left) / mmScale, wy = (e.clientY - r.top) / mmScale;
  const vr = vp.getBoundingClientRect();
  view.x = vr.width / 2 - wx * view.k;
  view.y = vr.height / 2 - wy * view.k;
  apply();
}
mm.addEventListener('pointerdown', e => { mm.setPointerCapture(e.pointerId); mmJump(e); mm.onpointermove = mmJump; });
mm.addEventListener('pointerup', () => mm.onpointermove = null);

// ---------------- controls ----------------
document.getElementById('z-in').onclick = () => { interacted = true; const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.35); };
document.getElementById('z-out').onclick = () => { interacted = true; const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.35); };
document.getElementById('z-fit').onclick = fitAll;
document.getElementById('menu-toggle').onclick = () => document.body.classList.toggle('menu-open');
window.addEventListener('resize', () => { if (!interacted) fitAll(); else apply(); });

// ---------------- boot ----------------
document.getElementById('stats').textContent =
  DATA.meta.nTables + ' tables · ' + DATA.meta.nViews + ' views · ' + DATA.meta.nCols.toLocaleString('en-US') + ' columns · ' + DATA.meta.nFks + ' relationships · live snapshot ' + DATA.meta.generated;
buildIndex('');
fitAll();
// the embedding pane can settle its size after first paint: refit until first interaction
[120, 400, 900].forEach(ms => setTimeout(() => { if (!interacted) fitAll(); }, ms));
const hash = decodeURIComponent(location.hash.slice(1));
if (hash && DATA.tables[hash]) select(hash, false);
if (hash && DATA.tables[hash]) setTimeout(() => { if (selected === hash) flyTo(hash); }, 450);
</script>
</body>
