name: Sync code to 8edges

# Mirrors code updates from edge8-web main into talentedgeai/8edges (the demo
# sandbox), as a file snapshot — the two repos share no git history.
#
# Never synced:
#   - credential material (.env files except .env.example, keys, certs)
#   - CI workflows (.github/) — they reference this repo's secrets
#   - files the 8edges demo owns (see EXCLUDES below and 8edges/.sync-protect)
#
# Requires the SYNC_8EDGES_TOKEN repo secret: a fine-grained PAT with
# Contents: Read and write on talentedgeai/8edges only.
#
# While the secret is not configured this workflow SKIPS with a notice instead
# of failing — a scheduled local job (launchd: ai.edge8.sync-to-8edges on
# Khoa's machine, ~/.local/bin/edge8-sync-to-8edges.sh) performs the same sync
# every 30 minutes in the meantime. Both are idempotent and can coexist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-8edges
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'talentedgeai/edge8-web'
    steps:
      - name: Check whether sync token is configured
        id: token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_8EDGES_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SYNC_8EDGES_TOKEN is not set — skipping CI sync. The scheduled local job (launchd: ai.edge8.sync-to-8edges) keeps 8edges in sync. Add the secret (fine-grained PAT, Contents read/write on talentedgeai/8edges) to sync from CI on every push."
            echo "Skipped: SYNC_8EDGES_TOKEN not configured; the scheduled local sync covers this." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout edge8-web
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          path: source

      - name: Clone 8edges
        if: steps.token.outputs.present == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_8EDGES_TOKEN }}
        run: |
          git clone --depth 1 --branch main \
            "https://x-access-token:${SYNC_TOKEN}@github.com/talentedgeai/8edges.git" target

      - name: Copy code updates (credentials and demo-owned files excluded)
        if: steps.token.outputs.present == 'true'
        run: |
          EXCLUDES=(
            --exclude='.git/'
            --exclude='.github/'
            --exclude='.claude/'
            --exclude='.vercel/'
            --exclude='node_modules/'

            # credential material never syncs
            --include='.env.example'
            --exclude='.env*'
            --exclude='*.pem'
            --exclude='*.key'
            --exclude='*.p12'
            --exclude='*.keystore'
            --exclude='*credentials*.json'

            # files the 8edges demo sandbox owns — never overwrite or delete
            --exclude='/README.md'
            --exclude='/.gitignore'
            --exclude='/scripts/crm/db.mjs'
            --exclude='/scripts/demo-seed/'
            --exclude='/.sync-protect'
          )

          # extra protected paths maintained inside the 8edges repo itself
          if [ -f target/.sync-protect ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in '#'*) continue ;; esac
              EXCLUDES+=("--exclude=$line")
            done < target/.sync-protect
          fi

          rsync -a --delete "${EXCLUDES[@]}" source/ target/

      - name: Commit and push to 8edges
        if: steps.token.outputs.present == 'true'
        run: |
          cd target
          git config user.name "edge8-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "8edges is already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit \
            -m "Sync code updates from edge8-web@${GITHUB_SHA::8}" \
            -m "Source: https://github.com/talentedgeai/edge8-web/commit/${GITHUB_SHA}"
          git push origin main
          echo "Synced edge8-web@${GITHUB_SHA::8} to 8edges." | tee -a "$GITHUB_STEP_SUMMARY"
